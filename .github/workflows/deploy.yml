name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: webApplictionsemesterIII/labAssignment1/portfolio
        run: npm install

      - name: Build
        working-directory: webApplictionsemesterIII/labAssignment1/portfolio
        run: npm run build

      - name: Copy index.html to 404.html for SPA routing
        run: cp webApplictionsemesterIII/labAssignment1/portfolio/dist/index.html webApplictionsemesterIII/labAssignment1/portfolio/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApplictionsemesterIII/labAssignment1/portfolio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
